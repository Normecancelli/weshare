name: Event Reminders
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminder endpoint
        run: |
          curl -sf -X GET "https://weshare.growset.it/api/cron/event-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
